<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>침대 7단계 케어 서비스</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #fff; padding-bottom: 80px; }
    img { display: block; width: 100%; }

    .sticky-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 999;
      padding: 12px 20px;
      background: rgba(255,255,255,0.95);
      box-shadow: 0 -2px 12px rgba(0,0,0,0.12);
    }

    .sticky-btn {
      display: block;
      width: 100%;
      background: #1a3a8f;
      color: #fff;
      font-size: 20px;
      font-weight: 700;
      font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      text-align: center;
      padding: 18px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      letter-spacing: -0.02em;
      transition: background 0.2s, transform 0.1s, box-shadow 0.2s;
      box-shadow: 0 4px 14px rgba(26,58,143,0.4);
    }

    .sticky-btn:hover {
      background: #1430a0;
      box-shadow: 0 6px 20px rgba(26,58,143,0.5);
    }

    .sticky-btn:active {
      transform: scale(0.98);
      box-shadow: 0 2px 8px rgba(26,58,143,0.3);
    }

    .video-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
    }

    .video-wrap iframe {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

  <img src="images/db5f3dc0-63ba-4b67-8ae2-2211f3b0afb6.webp" alt="" loading="eager" decoding="sync" />

  <div class="video-wrap">
    <iframe src="https://www.youtube.com/embed/N1KQF8IYi4c" frameborder="0" allowfullscreen loading="lazy"></iframe>
  </div>

  <img src="images/694838e8-61e6-4edf-b453-5b36c8a9a62c.webp" alt="" loading="lazy" decoding="async" />

  </div>

  <footer style="background:#1a1a1a;color:#aaa;font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:13px;padding:40px 24px;line-height:2;">
    <p style="color:#fff;font-weight:700;margin-bottom:12px;">청호나이스 침대케어 서비스</p>
    <p>담당자 : 이홍기</p>

    <p style="margin-top:16px;font-size:12px;color:#555;">© 2026 이홍기. All Rights Reserved.</p>

      0원 침대케어 신청
    </button>
